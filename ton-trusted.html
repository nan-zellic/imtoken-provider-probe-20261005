<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TON Trusted Session Fixture</title>
<style>
body{font:16px system-ui;margin:18px;background:#10151c;color:#edf4ff}
button{font:inherit;padding:12px 16px;margin:8px 0}
pre{white-space:pre-wrap;word-break:break-all;background:#1c2633;padding:12px;border-radius:8px}
</style>
<h2>TON trusted-session fixture</h2>
<p id="origin"></p>
<button id="connect">Connect disposable TON account</button>
<button id="restore">Restore this origin</button>
<pre id="state">Waiting for the injected TON provider…</pre>
<script>
const RUN='TON_SESSION_A_20261005_01';
const BASE='https://nan-zellic.github.io/imtoken-provider-probe-20261005';
origin.textContent='Actual trusted origin: '+location.origin;
const show=x=>state.textContent=typeof x==='string'?x:JSON.stringify(x,null,2);
const err=e=>show({error:e?.message||String(e),stack:e?.stack});
connect.onclick=async()=>{
  try{
    show('Calling the public TON Connect provider…');
    const result=await window.imToken.tonconnect.connect(2,{
      manifestUrl:BASE+'/tonconnect-manifest.json',
      items:[{name:'ton_addr'}]
    });
    show({run:RUN,action:'connect',actualOrigin:location.origin,result});
  }catch(e){err(e)}
};
restore.onclick=async()=>{
  try{
    const result=await window.imToken.tonconnect.restoreConnection();
    show({run:RUN,action:'honest-restore',actualOrigin:location.origin,result});
  }catch(e){err(e)}
};
</script>
